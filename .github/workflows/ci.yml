name: CI/CD

on:
  pull_request:
    branches:
      - "**"
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tasks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build app
        run: mvn -B -DskipTests clean package

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tasks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Checkstyle
        run: mvn -B checkstyle:check

  test:
    name: Test + Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tasks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests and verify coverage >= 50%
        run: mvn -B clean verify

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            tasks/target/site/jacoco
            tasks/target/jacoco.exec
          if-no-files-found: error

  docker_build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build, lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build docker image
        run: docker build -t local/tasks-app:${{ github.sha }} ./tasks

  docker_push:
    name: Docker Push
    runs-on: ubuntu-latest
    needs: [docker_build]
    if: ${{ github.event.pull_request.head.repo.fork == false && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Docker tag
        id: vars
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./tasks
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tasks-app:pr-${{ github.event.pull_request.number }}-${{ steps.vars.outputs.short_sha }}
